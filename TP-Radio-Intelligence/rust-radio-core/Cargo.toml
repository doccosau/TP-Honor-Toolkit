[package]
name = "radio_core"
version = "1.0.0"
edition = "2021"
authors = ["TichPhong Team"]
description = "Enterprise-Grade Native Telecom RF & Signal Processing Core for Honor Flagships"

[lib]
name = "radio_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

