name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(echo -n "$RAW_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(echo -n "$RAW_ACCOUNT_ID" | tr -d '[:space:]')"
          
          echo "=== 1. Checking Token Verification ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify"
          echo ""
          
          echo "=== 2. Resolving Account ID ==="
          ACCOUNTS_JSON=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts")
          echo "Accounts list response: $ACCOUNTS_JSON"
          
          DETECTED_ID=$(echo "$ACCOUNTS_JSON" | jq -r '.result[0].id // empty')
          if [ -n "$DETECTED_ID" ] && [ "$DETECTED_ID" != "null" ]; then
            echo "Successfully auto-detected Cloudflare Account ID: $DETECTED_ID"
            export CLOUDFLARE_ACCOUNT_ID="$DETECTED_ID"
          else
            echo "Using configured Account ID from secret: $CLOUDFLARE_ACCOUNT_ID"
          fi
          
          echo "=== 3. Checking Wrangler Authentication ==="
          npx wrangler whoami
          
          echo "=== 4. Deploying dist to Cloudflare Pages project 'tphntools' ==="
          npx wrangler pages deploy dist --project-name=tphntools --branch=main --commit-dirty=true
